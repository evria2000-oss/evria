services:
  - type: web
    name: vstream
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ROOM_CODE
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "500"
